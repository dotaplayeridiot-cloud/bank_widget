
[tool.poetry]
name = "bank-widget"
version = "0.1.0"
description = "Bank widget project"
authors = ["Misha <misha@example.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.15"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.1.0"
black = "^24.10.0"
isort = "^5.13.2"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
target-version = ["py315"]

[tool.isort]
profile = "black"
line_length = 119

[tool.mypy]
python_version = "3.15"
strict = true